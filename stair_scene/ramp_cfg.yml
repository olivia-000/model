# U-shaped (switchback) staircase for the custom "multi_floor" scene: two 10-step flights (each
# 0.15m riser x 0.30m tread, matching the low-level policy's trained/critical-zone stair range,
# see go2_stairs_train_cfg.py) connected by a landing, leading up to a 2F room floor. Every entry
# here (steps, landing, 2F floor) is a solid block spanning z=0 (the actual floor) up to its own
# tread height -- same "no gaps a foot could catch on" convention warehouse_official/ramp_cfg.yml
# uses -- so the height-scan-aware policy always finds continuous ground under it, never a cliff
# edge between adjacent steps or a hole between the last step and the room floor above it.
# Positions/sizes are computed directly from multi_floor_scene.py's own geometry constants
# (STEP_HEIGHT=0.15, STEP_DEPTH=0.30, STAIR_WIDTH=1.50, STEPS_PER_FLIGHT=10, first_start_x=-4.0,
# first_y=-1.20, second_y=1.20, HALF_HEIGHT=1.50, LANDING_LENGTH=1.50, LANDING_WIDTH=4.20,
# SECOND_FLOOR_LENGTH=7.0, SECOND_FLOOR_WIDTH=10.0, second_floor_center_x=-7.5) -- keep in sync if
# that script's layout ever changes. yaw_deg=0 throughout: incline_deg=0 (flat steps) makes a
# symmetric box yaw-invariant, and size=[x_extent, y_extent, z_extent] already matches world
# X/Y directly with no rotation needed.

# --- Flight A: climbs +X, y=-1.20, x from -3.85 to -1.15 ---
