# --- 2F room floor: x=-11.0 to -4.0, y=-5.0 to 5.0, top=3.0m -- split into 4 solid blocks
# instead of one, leaving a 2m-deep x 5m-wide x 2.2m-tall open tunnel (x=-6.0 to -4.0, y=-2.5 to
# 2.5, z=0 to 2.2) right at the base of the U-shaped staircase (StairA/B both land around
# x=-4.0/-4.15, y in [-2.01, 2.01]) so the robot can walk straight through underneath the 2F
# structure instead of it being one sheer solid wall at ground level. The 4 blocks' tops all still
# reach z=3.0, so the walkable 2F floor surface is exactly as continuous as the single-block
# version was -- only the ground-level middle section (behind the tunnel) is hollowed out.
floor_2_back:
  prim_name: "Floor2_Back"
  translation: [-8.5, 0.0, 1.5]
  size: [5.0, 10.0, 3.0]
  incline_deg: 0.0
  yaw_deg: 0.0
floor_2_side_pos_y:
